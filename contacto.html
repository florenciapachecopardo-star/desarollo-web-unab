<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacto | Chocomanía</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="cabecera">
        <a class="marca" href="index.html">Chocomanía</a>
        <nav class="menu" aria-label="Principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="index.html#productos">Productos</a></li>
                <li><a href="ayuda.html">Ayuda</a></li>
                <li><a href="registro.html">Regístrate</a></li>
            </ul>
        </nav>
        <span class="cuenta" id="cuenta-cabecera"></span>
        <a class="carrito" id="carrito" href="carrito.html">Carrito (0)</a>
    </header>

    <main class="pagina">
        <section class="tarjeta-form">
            <h1>Contacto</h1>
            <p class="tarjeta-form__intro">Escríbenos y te respondemos a la brevedad.</p>

            <form id="form-contacto" novalidate>
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div class="campo">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" required>
                </div>
                <div class="campo">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
                </div>
                <p class="form-error" id="error" role="alert"></p>
                <p class="form-exito" id="exito" role="status"></p>
                <button type="submit" class="boton">Enviar</button>
            </form>
        </section>
    </main>

    <footer class="pie">
        <p class="pie__copy">© Chocomanía</p>
    </footer>

    <script src="js/datos.js"></script>
    <script src="js/cuentas.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/contacto.js"></script>
</body>
</html>
