# Contenedor frontend (U3): sirve el sitio estatico y manda /api/ al API Gateway.
# El navegador solo habla con este contenedor; toda la API pasa por el gateway.

# El log incluye a que upstream se mando la llamada y el X-Request-ID que devolvio
# el gateway, para seguir la misma solicitud en los logs de los demas contenedores.
log_format frontend_api escape=json
  '{"ts":"$time_iso8601","service":"frontend","event":"api_proxied",'
  '"method":"$request_method","path":"$uri","status":$status,'
  '"proxy_to":"$proxy_host","upstream":"$upstream_addr","request_id":"$upstream_http_x_request_id",'
  '"upstream_seg":"$upstream_response_time"}';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Solo se registran las llamadas a la API, no cada imagen o css
    access_log off;

    location /api/ {
        access_log /dev/stdout frontend_api;
        proxy_pass http://gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
