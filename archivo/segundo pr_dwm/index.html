<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Dulce Aroma - Cafetería</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>        
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    </head>
    <body>
        <!-- Navbar -->
        <nav class="navbar navbar-expand-sm navbar-dark" style="background-color: #4E342E;">
            <div class="container-fluid"> 
                <a class="navbar-brand" href="index.html"><i class="fa fa-coffee"></i> Dulce Aroma</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="collapsibleNavbar">
                    <ul class="navbar-nav">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Empresa</a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="empresa.html">Quiénes Somos</a></li>
                                <li><a class="dropdown-item" href="empresa.html">Nuestro Equipo</a></li>
                                <li><a class="dropdown-item" href="empresa.html">Misión</a></li>
                            </ul>
                        </li>                        
                        <li class="nav-item">
                            <a class="nav-link" href="productos.html">Productos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="servicios.html">Servicios</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="contacto.html">Contacto</a>
                        </li>                                                 
                    </ul>
                </div>  
                <button type="button" class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#myModal">Acceder</button>               
            </div>
        </nav>       
        <!-- Container -->
        <div class="container-fluid p-4" style="background-color: #FFF8E1;">
            <h2 style="color: #4E342E;">Dulce Aroma</h2>
            <p>Café y pastelería</p>
            <hr>
            <div class="row">
                <div class="col-12 col-sm-6 col-md-3 mb-2">
                    <a href="empresa.html" class="btn w-100" style="background-color: #6D4C41; color: white;"><i class="fa fa-users"></i> Empresa</a>
                </div>
                <div class="col-12 col-sm-6 col-md-3 mb-2">
                    <a href="productos.html" class="btn w-100" style="background-color: #6D4C41; color: white;"><i class="fa fa-shopping-bag"></i> Productos</a>
                </div>
                <div class="col-12 col-sm-6 col-md-3 mb-2">
                    <a href="servicios.html" class="btn w-100" style="background-color: #6D4C41; color: white;"><i class="fa fa-list"></i> Servicios</a>
                </div>
                <div class="col-12 col-sm-6 col-md-3 mb-2">
                    <a href="contacto.html" class="btn w-100" style="background-color: #6D4C41; color: white;"><i class="fa fa-envelope"></i> Contacto</a>
                </div>
            </div>
        </div>
        <!-- Footer -->   
        <div class="container-fluid py-3" style="background-color: #3E2723;">
            <div class="row">
                <div class="col-12 text-center" style="color: #D7CCC8;">
                    <strong><i class="fa fa-coffee"></i> Dulce Aroma &copy; 2026</strong>
                </div>
            </div>
        </div>
        <!-- Modal -->     
        <div class="modal fade" id="myModal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header" style="background-color: #4E342E; color: white;">
                        <h4 class="modal-title">Autenticación</h4>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form action="empresa.html">
                            <div class="mb-3 mt-3">
                                <label for="email" class="form-label">Email:</label>
                                <input type="email" class="form-control" id="email" placeholder="Ingrese su email" name="email">
                            </div>
                            <div class="mb-3">
                                <label for="pwd" class="form-label">Contraseña:</label>
                                <input type="password" class="form-control" id="pwd" placeholder="Ingrese su contraseña" name="pswd">
                            </div>
                            <div class="form-check mb-3">
                                <label class="form-check-label">
                                    <input class="form-check-input" type="checkbox" name="remember"> Recordarme
                                </label>
                            </div>
                            <button type="submit" class="btn" style="background-color: #4E342E; color: white;">Ingresar</button>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
