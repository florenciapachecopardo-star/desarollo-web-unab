<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Dulce Aroma - Contacto</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>        
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    </head>
    <body>
        <!-- Navbar -->
        <nav class="navbar navbar-expand-sm navbar-dark" style="background-color: #4E342E;">
            <div class="container-fluid"> 
                <a class="navbar-brand" href="index.html"><i class="fa fa-coffee"></i> Dulce Aroma</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="collapsibleNavbar">
                    <ul class="navbar-nav">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Empresa</a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="empresa.html">Quiénes Somos</a></li>
                                <li><a class="dropdown-item" href="empresa.html">Nuestro Equipo</a></li>
                                <li><a class="dropdown-item" href="empresa.html">Misión</a></li>
                            </ul>
                        </li>                        
                        <li class="nav-item">
                            <a class="nav-link" href="productos.html">Productos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="servicios.html">Servicios</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="contacto.html">Contacto</a>
                        </li>  
                    </ul>
                </div>                
            </div>
        </nav>       
        <!-- Container -->
        <div class="container-fluid p-4" style="background-color: #FFF8E1;">
            <h2 style="color: #4E342E;"><i class="fa fa-envelope"></i> Contacto</h2>
            <hr>
            <div class="row">
                <div class="col-12 col-md-8 mb-3">
                    <h4 style="color: #6D4C41;">Envíanos un mensaje</h4>
                    <form action="index.html">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre:</label>
                            <input type="text" class="form-control" id="nombre" placeholder="Tu nombre" name="nombre">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email:</label>
                            <input type="email" class="form-control" id="email" placeholder="Tu email" name="email">
                        </div>
                        <div class="mb-3">
                            <label for="comment" class="form-label">Comentarios:</label>
                            <textarea class="form-control" rows="5" id="comment" name="text"></textarea>
                        </div>
                        <button type="submit" class="btn" style="background-color: #4E342E; color: white;">Enviar</button>
                    </form>
                </div>
                <div class="col-12 col-md-4">
                    <h4 style="color: #6D4C41;">Datos de contacto</h4>
                    <p><i class="fa fa-map-marker" style="color: #6D4C41;"></i> Av. Providencia 1234, Santiago</p>
                    <p><i class="fa fa-phone" style="color: #6D4C41;"></i> +56 9 1234 5678</p>
                    <p><i class="fa fa-envelope" style="color: #6D4C41;"></i> contacto@dulcearoma.cl</p>
                    <p><i class="fa fa-clock-o" style="color: #6D4C41;"></i> Lunes a Domingo, 8:00 - 20:00</p>
                </div>
            </div>
            <hr>
            <a href="index.html" class="btn" style="background-color: #6D4C41; color: white;">Volver</a>
        </div>
        <!-- Footer -->   
        <div class="container-fluid py-3" style="background-color: #3E2723;">
            <div class="row">
                <div class="col-12 text-center" style="color: #D7CCC8;">
                    <strong><i class="fa fa-coffee"></i> Dulce Aroma &copy; 2026</strong>
                </div>
            </div>
        </div>
    </body>
</html>
