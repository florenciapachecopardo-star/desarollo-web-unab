<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Productos</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            let productos = [
                {"id": "1", "nombre": "Martillo", "precio": "$5.000"},
                {"id": "2", "nombre": "Tijera", "precio": "$3.000"}
            ];

            function agregarProducto() {
                let id = document.getElementById("txtId").value;
                let nombre = document.getElementById("txtNombre").value;
                let precio = document.getElementById("txtPrecio").value;
                productos.push({"id": id, "nombre": nombre, "precio": precio});
                document.getElementById("txtId").value = "";
                document.getElementById("txtNombre").value = "";
                document.getElementById("txtPrecio").value = "";
                mostrarProductos();
            }

                        function mostrarProductos() {
                let lista = document.getElementById("listaProductos");
                lista.innerHTML = "";
                let tabla = document.createElement("table");
                tabla.setAttribute("class", "table table-striped");
                let thead = document.createElement("thead");
                thead.innerHTML = "<tr><th>ID</th><th>Nombre</th><th>Precio</th></tr>";
                tabla.appendChild(thead);
                let tbody = document.createElement("tbody");
                productos.forEach((prod) => {
                    let fila = document.createElement("tr");
                    let tdId = document.createElement("td");
                    tdId.innerText = prod.id;
                    let tdNombre = document.createElement("td");
                    tdNombre.innerText = prod.nombre;
                    let tdPrecio = document.createElement("td");
                    tdPrecio.innerText = prod.precio;
                    fila.appendChild(tdId);
                    fila.appendChild(tdNombre);
                    fila.appendChild(tdPrecio);
                    tbody.appendChild(fila);
                });
                tabla.appendChild(tbody);
                lista.appendChild(tabla);
            }
        </script>
    </head>
    <body onload="mostrarProductos();">
        <div class="container mt-3">
            <h2>Productos</h2>
            <hr>
            <label class="form-label">ID:</label>
            <input type="text" class="form-control mb-2" id="txtId">
            <label class="form-label">Nombre:</label>
            <input type="text" class="form-control mb-2" id="txtNombre">
            <label class="form-label">Precio:</label>
            <input type="text" class="form-control mb-2" id="txtPrecio">
            <button type="button" class="btn btn-primary mb-3" onclick="agregarProducto();">Agregar</button>
            <hr>
            <div id="listaProductos"></div>
        </div>
    </body>
</html>
